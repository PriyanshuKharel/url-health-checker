worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS. Resolving the service name at request time (via the
  # variable below) spreads requests across every `api` replica.
  resolver 127.0.0.11 valid=5s ipv6=off;

  access_log /dev/stdout;

  server {
    listen 4000;

    location / {
      set $upstream http://api:4000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Server-Sent Events: stream bytes as they arrive and keep idle streams open.
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # Handy when demonstrating multiple API instances.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
